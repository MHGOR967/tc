services:
  - type: web
    name: telegram-bot-server
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        scope: build
      - key: DATABASE_URL
        scope: build
      - key: JWT_SECRET
        scope: build
      - key: WEBHOOK_SECRET
        value: your-secret-key
      - key: ADMIN_IDS
        value: "123456789,987654321"
      - key: VITE_APP_ID
        scope: build
      - key: OAUTH_SERVER_URL
        scope: build
      - key: VITE_OAUTH_PORTAL_URL
        scope: build
      - key: BUILT_IN_FORGE_API_URL
        scope: build
      - key: BUILT_IN_FORGE_API_KEY
        scope: build
      - key: VITE_FRONTEND_FORGE_API_URL
        scope: build
      - key: VITE_FRONTEND_FORGE_API_KEY
        scope: build
